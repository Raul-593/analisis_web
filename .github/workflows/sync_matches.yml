name: Sync Champions League Matches

on:
  schedule:
    - cron: '*/59 17-22 * 9,10,11,12,1,2,3,4,5 2,3'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        working-directory: champions_web
        run: pip install -r requirements.txt

      - name: Ejecutar sincronizacion
        working-directory: champions_web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBAL_DATA_API_KEY }}
        run: python -m data_pipeline/sync_matches
